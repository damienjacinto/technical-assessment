name: Build fake-app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag / VERSION to build (defaults to commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-fake-app-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_ALIAS: l4z8k7v4
  REPOSITORY: redemption-app

jobs:
  build-and-push:
    name: Build and push to ECR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to ECR Public
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Ensure ECR Public repository exists
        run: |
          aws ecr-public describe-repositories --repository-names "$REPOSITORY" --region us-east-1

      - name: Build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.version || github.sha }}
        run: |
          docker build --build-arg VERSION="$IMAGE_TAG" -t "$REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG" app/fake-app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.REGISTRY_ALIAS }}/${{ env.REPOSITORY }}:${{ inputs.version || github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ inputs.version || github.sha }}
        run: |
          docker push "$REGISTRY/$REGISTRY_ALIAS/$REPOSITORY:$IMAGE_TAG"
