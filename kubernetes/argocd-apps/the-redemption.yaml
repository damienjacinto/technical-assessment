apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-redemption
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: redemption
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/damienjacinto/technical-assessment.git
    targetRevision: main
    path: kubernetes/apps/the-redemption
    helm:
      # environment is static/git-known; the ALB security group ID isn't
      # (Terraform-created), so it's deliberately not set her. See
      # templates/ingress.yaml's lookup() instead.
      valuesObject:
        environment: prod
      # image.repository/tag: CI-built, not git-known ahead of time, and
      # bumped independently of every other change here — kept in their
      # own file instead of valuesObject so bumping them is a one-line
      # diff. See override.yaml's own comment.
      valueFiles:
        - override.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: the-redemption
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
