# One ApplicationSet for all 7 identically-shaped infra-apps. Only name
# + namespace differ, expressed as list-generator data instead of 7
# copy-pasted files. the-redemption stays its own Application (needs an
# extra Helm value and a different source path prefix).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: capacity-buffer
            namespace: the-redemption
          - name: keda
            namespace: keda
          - name: argo-rollouts
            namespace: argo-rollouts
          - name: kyverno
            namespace: kyverno
          - name: external-secrets
            namespace: external-secrets
          - name: otel-collector
            namespace: observability
          - name: kube-prometheus-stack
            namespace: observability
          - name: karpenter-nodepools
            namespace: kube-system
  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/part-of: redemption
        app.kubernetes.io/managed-by: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/damienjacinto/technical-assessment.git
        targetRevision: main
        path: "kubernetes/infra-apps/{{name}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      ignoreDifferences:
        - group: kyverno.io
          kind: ClusterPolicy
          jqPathExpressions:
            - .spec.admission
            - .spec.emitWarning
            - .spec.rules[].skipBackgroundRequests
            - .spec.rules[].validate.allowExistingViolations
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .metadata.annotations
            - .metadata.labels
            - .spec.conversion
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
