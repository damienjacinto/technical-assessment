# One ApplicationSet instead of one Application file per infra-app: all 7
# share an identical shape (source.path = kubernetes/infra-apps/<name>,
# same repo/revision, same sync policy) and only differ in name +
# destination namespace -- the list generator's `elements` is that
# difference, expressed once as data instead of copy-pasted across 7
# near-identical files. the-redemption is deliberately NOT here: it needs
# an extra Helm value and a different source path prefix
# (kubernetes/apps/..., not kubernetes/infra-apps/...), so it stays its
# own explicit Application (the-redemption.yaml) rather than being forced
# into this template for one exception.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: capacity-buffer
            namespace: kube-system
          - name: keda
            namespace: keda
          - name: argo-rollouts
            namespace: argo-rollouts
          - name: kyverno
            namespace: kyverno
          - name: external-secrets
            namespace: external-secrets
          - name: otel-collector
            namespace: observability
          - name: kube-prometheus-stack
            namespace: observability
  template:
    metadata:
      name: "{{name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/part-of: redemption
        app.kubernetes.io/managed-by: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/damienjacinto/technical-assessment.git
        targetRevision: main
        path: "kubernetes/infra-apps/{{name}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
