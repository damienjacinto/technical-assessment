# Argo Rollouts canary, not a plain Deployment. Automated analysis gates
# each step and auto-rolls-back on SLO breach, which is the concrete answer
# to "recover from a bad deployment with minimal customer impact."
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "the-redemption.fullname" . }}
  labels:
    {{- include "the-redemption.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "the-redemption.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      analysis:
        templates:
          - templateName: {{ include "the-redemption.fullname" . }}-success-rate-and-latency
        startingStep: 1
        args:
          - name: service-name
            value: {{ include "the-redemption.fullname" . }}
      steps:
        - setWeight: 10
        - pause: { duration: 1m }
        # Not analysis: {} - that has no templates of its own, so Argo
        # Rollouts never creates a step-scoped AnalysisRun for it and the
        # rollout stalls here forever, regardless of the background
        # analysis's own result.
        - analysis:
            templates:
              - templateName: {{ include "the-redemption.fullname" . }}-success-rate-and-latency
            args:
              - name: service-name
                value: {{ include "the-redemption.fullname" . }}
        - setWeight: 50
        - pause: { duration: 1m }
        - setWeight: 100
  template:
    metadata:
      labels:
        {{- include "the-redemption.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "the-redemption.fullname" . }}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: capacity-tier
                    operator: In
                    values:
                      - on-demand-baseline
      # Zone-level: hard requirement, the real resilience boundary (AZ
      # outage). minDomains: 3 stops 2 replicas trivially "satisfying" skew
      # across only 2 zones. Node-level: soft, doesn't fight Karpenter's
      # bin-packing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          minDomains: 3
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "the-redemption.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "the-redemption.selectorLabels" . | nindent 14 }}
      containers:
        - name: {{ include "the-redemption.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.collectorEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ include "the-redemption.fullname" . }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "http"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# "args.service-name" below is Argo Rollouts' own templating syntax
# (resolved at AnalysisRun time), escaped so Helm renders it literally.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "the-redemption.fullname" . }}-success-rate-and-latency
  labels:
    {{- include "the-redemption.labels" . | nindent 4 }}
spec:
  args:
    - name: service-name
  metrics:
    - name: error-rate
      interval: 1m
      count: 3
      successCondition: result[0] <= 0.01
      failureLimit: 3
      provider:
        prometheus:
          address: {{ .Values.prometheus.address }}
          query: |
            (sum(rate(http_server_request_duration_seconds_count{job="{{ "{{args.service-name}}" }}",http_response_status_code=~"5.."}[5m])) or vector(0))
            /
            (sum(rate(http_server_request_duration_seconds_count{job="{{ "{{args.service-name}}" }}"}[5m])) or vector(1))
    - name: p99-latency-seconds
      interval: 1m
      count: 3
      successCondition: result[0] <= 0.5
      failureLimit: 3
      provider:
        prometheus:
          address: {{ .Values.prometheus.address }}
          query: |
            histogram_quantile(0.99, sum(rate(http_server_request_duration_seconds_bucket{job="{{ "{{args.service-name}}" }}"}[5m])) by (le)) or vector(0)
