# Default-deny + explicit allows, not the other way around. Least
# privilege applied at the network layer, underneath the security group
# backstop from terraform/modules/security-baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: the-redemption-default-deny
  namespace: the-redemption
  labels:
    {{- include "the-redemption.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: the-redemption-allow
  namespace: the-redemption
  labels:
    {{- include "the-redemption.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: the-redemption
  policyTypes: [Ingress, Egress]
  ingress:
    # ALB (target-type ip) sends traffic from its own ENIs in-VPC, not from
    # a cluster-internal pod, so this is a CIDR match, not a
    # namespaceSelector/podSelector.
    - from:
        - ipBlock:
            cidr: {{ .Values.network.vpcCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # OTLP to the Collector.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4317
    # AWS API calls via VPC interface endpoints, and the future database
    # tier. Not this pod's own credentials. Pod Identity vends those
    # node-locally, bypassing this egress path.
    - to:
        - ipBlock:
            cidr: {{ .Values.network.vpcCidr }}
      ports:
        - protocol: TCP
          port: 443
