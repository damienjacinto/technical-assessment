apiVersion: v1
kind: Service
metadata:
  name: {{ include "the-redemption.fullname" . }}
  labels:
    {{- include "the-redemption.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "the-redemption.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
