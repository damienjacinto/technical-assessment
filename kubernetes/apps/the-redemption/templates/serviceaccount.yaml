# No eks.amazonaws.com/role-arn annotation: this ServiceAccount authenticates
# via EKS Pod Identity, not IRSA -- the role<->ServiceAccount pairing is an
# aws_eks_pod_identity_association (terraform/envs/prod/foundation/main.tf),
# not something wired into this manifest.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: the-redemption
  namespace: the-redemption
  labels:
    {{- include "the-redemption.labels" . | nindent 4 }}
