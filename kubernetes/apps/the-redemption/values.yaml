# Defaults here are for local helm lint/template (see ingress.albSecurityGroupId
# below). `environment` comes from the static Application's valuesObject;
# `albSecurityGroupId` comes from templates/ingress.yaml's lookup() reading
# a Terraform-written ConfigMap instead (see NOTES.md for why they differ).

image:
  # Placeholder image (app/fake-app): no business logic, just a Flask stub
  # with OTel auto-instrumentation. Not Terraform-managed (no ECR/IAM
  # resources for it). These are the local helm lint/template fallback
  # only — the live ArgoCD deployment gets its real repository/tag from
  # override.yaml (kubernetes/argocd-apps/the-redemption.yaml's
  # helm.valueFiles), bumped there after each image you want deployed.
  repository: "public.ecr.aws/l4z8k7v4/redemption-app"
  tag: "unset"

# Steady-state floor; KEDA governs scaling beyond it (Karpenter holds no
# floor of its own, docs/ARCHITECTURE.md).
replicaCount: 3

environment: prod
port: 8080

ingress:
  # Placeholder; templates/ingress.yaml's lookup() overrides with the
  # real ALB security group ID on a live cluster.
  albSecurityGroupId: ""
  # Empty: no owned domain, so no host rule (templates/ingress.yaml).
  # Set this once a real domain exists.
  host: ""

otel:
  collectorEndpoint: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317"

resources:
  requests:
    cpu: 512m
    memory: 256Mi
  limits:
    memory: 512Mi

pdb:
  minAvailable: "66%"

network:
  # Must match terraform/envs/prod/foundation's vpc_cidr.
  vpcCidr: "10.0.0.0/16"

prometheus:
  address: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
