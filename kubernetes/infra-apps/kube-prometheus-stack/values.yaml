# Self-hosted, not AWS-managed AMP/AMG (docs/ARCHITECTURE.md trade-off).
# No EBS CSI driver -- Prometheus uses emptyDir, retention resets on reschedule. Grafana disabled.
# Alertmanager and default alerting rules disabled for now (temporary).
kube-prometheus-stack:
  prometheusOperator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    containerSecurityContext:
      runAsNonRoot: true
    nodeSelector: &tools-node-selector
      karpenter.sh/nodepool: tools
    tolerations: &tools-tolerations
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule

  prometheus:
    prometheusSpec:
      replicas: 2
      retention: 15d
      nodeSelector: *tools-node-selector
      tolerations: *tools-tolerations
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 4Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      additionalScrapeConfigs:
        - job_name: otel-collector
          kubernetes_sd_configs:
            - role: endpoints
              namespaces:
                names: [observability]
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              regex: otel-collector.*
              action: keep
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  alertmanager:
    enabled: false

  defaultRules:
    create: false

  grafana:
    enabled: false

  kube-state-metrics:
    nodeSelector: *tools-node-selector
    tolerations: *tools-tolerations
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    containerSecurityContext:
      runAsNonRoot: true

  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        memory: 64Mi
    containerSecurityContext:
      runAsNonRoot: true
