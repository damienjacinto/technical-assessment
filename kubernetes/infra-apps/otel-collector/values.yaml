# Gateway deployment (not per-node DaemonSet): the-redemption pushes OTLP
# here directly, exported to Prometheus (docs/ARCHITECTURE.md).
opentelemetry-collector:
  mode: deployment
  replicaCount: 1

  # Chart sets no securityContext at all by default require-run-as-non-root
  # checks the container level explicitly.
  securityContext:
    runAsNonRoot: true

  # Dedicated tooling NodePool. Safe only because mode is "deployment";
  # a DaemonSet restricted to one NodePool would break per-node coverage.
  nodeSelector:
    karpenter.sh/nodepool: tools
  tolerations:
    - key: dedicated
      operator: Equal
      value: tools
      effect: NoSchedule

  image:
    repository: otel/opentelemetry-collector-contrib

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 768Mi

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      # Prometheus scrapes this Collector's /metrics endpoint (see
      # kube-prometheus-stack's ServiceMonitor for the Collector in that
      # chart's values.yaml).
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [prometheus]

  ports:
    metrics:
      enabled: true
      containerPort: 8889
      servicePort: 8889
