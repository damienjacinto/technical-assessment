argo-rollouts:
  controller:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    nodeSelector:
      karpenter.sh/nodepool: tools
    tolerations:
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule
  dashboard:
    enabled: true
    nodeSelector:
      karpenter.sh/nodepool: tools
    tolerations:
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule
