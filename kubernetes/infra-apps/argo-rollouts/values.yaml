argo-rollouts:
  # Chart only sets runAsNonRoot at the pod level by default -- require-run-as-non-root
  # checks the container level, so it's spelled out here too.
  containerSecurityContext:
    runAsNonRoot: true
  controller:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    nodeSelector:
      karpenter.sh/nodepool: tools
    tolerations:
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule
  dashboard:
    enabled: true
    containerSecurityContext:
      runAsNonRoot: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    nodeSelector:
      karpenter.sh/nodepool: tools
    tolerations:
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule
