keda:
  # Chart only sets runAsNonRoot at the pod level by default -- require-run-as-non-root
  # checks the container level, so it's spelled out here too, for all three components.
  securityContext:
    operator:
      runAsNonRoot: true
    metricServer:
      runAsNonRoot: true
    webhooks:
      runAsNonRoot: true
  resources:
    operator:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Unset falls back to the chart's own default, which sets limits.cpu -- explicit override needed.
    metricServer:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  podDisruptionBudget:
    operator:
      minAvailable: 1
  nodeSelector:
    karpenter.sh/nodepool: tools
  tolerations:
    - key: dedicated
      operator: Equal
      value: tools
      effect: NoSchedule
