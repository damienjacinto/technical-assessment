# On-demand baseline + Spot burst overflow, tiered by an *enforced* limits
# ceiling (not just weight). See docs/ARCHITECTURE.md's Scalability
# Strategy section. EC2NodeClass and the "tools" NodePool stay
# Terraform-managed (terraform/modules/karpenter/nodepools.tf) - only
# these two, workload-facing pools moved to GitOps.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand-baseline
spec:
  weight: 100
  template:
    metadata:
      labels:
        capacity-tier: on-demand-baseline
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: redemption-prod
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          # Only 2 cpu node to make scaling showcase easier
          values:
            - m6i.large
            - m5.large
            - c6i.large
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-east-1a
            - us-east-1b
            - us-east-1c
      # Bounds node lifetime so drift/leaks can't accumulate silently,
      # and exercises the pod-rescheduling/PDB path continuously.
      expireAfter: 24h
  limits:
    # Baseline max 3 nodes to make scaling showcase easier
    cpu: "6"
    memory: 100Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "20%"
      # Flash-sale blackout: 0 disruption so recycling/consolidation
      # never rotates capacity out at peak load. Placeholder schedule.
      - nodes: "0"
        schedule: "0 12 * * 5"
        duration: 2h
