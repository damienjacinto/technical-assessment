# Enforced, not just advisory: a pod with no resource requests is exactly
# the failure mode that lets one runaway workload starve the-redemption
# during a flash sale, and it also breaks Karpenter's bin-packing math.
# No CPU limit requirement, deliberately: CPU is compressible (throttling
# wastes burst capacity for no benefit); memory limits still matter since memory isn't.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests-limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-requests-and-limits
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Every container must set CPU/memory requests and a memory limit."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
