apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    # Job/CronJob excluded: short-lived Helm hook containers (e.g. chart
    # admission-webhook cert-gen jobs) run as whatever their vendor image needs.
    pod-policies.kyverno.io/autogen-controllers: DaemonSet,Deployment,StatefulSet
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Containers must not run as root (runAsNonRoot: true required)."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: "true"
