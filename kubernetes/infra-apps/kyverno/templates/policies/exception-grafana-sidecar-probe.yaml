# kube-prometheus-stack's grafana sc-dashboard/sc-datasources sidecars
# (kiwigrid/k8s-sidecar) expose no HTTP health endpoint, so the chart has
# no readinessProbe/livenessProbe field for them -- require-probes can
# never be satisfied via values, same situation as argocd's controller.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: grafana-sidecar-probe-exception
  namespace: argocd
spec:
  exceptions:
    - policyName: require-probes
      ruleNames:
        - require-readiness-and-liveness-probes
        - autogen-require-readiness-and-liveness-probes
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
          namespaces:
            - observability
          names:
            - "*grafana*"
