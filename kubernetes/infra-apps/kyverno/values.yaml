kyverno:
  replicaCount: 1
  features:
    policyExceptions:
      enabled: true
      namespace: argocd
  admissionController:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    nodeSelector: &tools-node-selector
      karpenter.sh/nodepool: tools
    tolerations: &tools-tolerations
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule
  backgroundController:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
    nodeSelector: *tools-node-selector
    tolerations: *tools-tolerations
  cleanupController:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
    nodeSelector: *tools-node-selector
    tolerations: *tools-tolerations
  reportsController:
    # Aggregates policy reports cluster-wide -- can grow with resource count.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    nodeSelector: *tools-node-selector
    tolerations: *tools-tolerations
