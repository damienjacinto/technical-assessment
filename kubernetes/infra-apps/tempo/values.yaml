tempo:
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Single-binary mode is deliberate here: this is a small, single-microservice
  # stack (see docs/ARCHITECTURE.md's service-mesh trade-off note), so the
  # distributed multi-component Tempo deployment mode would be complexity
  # without a corresponding benefit.
  tempo:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
