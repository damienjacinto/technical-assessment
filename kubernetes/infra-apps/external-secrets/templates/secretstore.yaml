# Cluster-scoped; really scoped by the Pod Identity role's own policy,
# not this manifest. No auth block: Pod Identity supplies credentials
# automatically. apiVersion v1: v1beta1 stopped being served at v0.17.0.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: redemption-prod-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
