# Example SecretStore -- cluster-scoped so the-redemption's namespace (and
# any future namespace) can reference it via ClusterSecretStore. Scoped by
# the external-secrets Pod Identity role's own least-privilege policy (see
# terraform/envs/prod/platform/main.tf), not by anything in this manifest.
# No auth.jwt.serviceAccountRef block: that's the IRSA auth method. With EKS
# Pod Identity, the external-secrets ServiceAccount already carries the
# role's credentials via the agent DaemonSet, so ESO's AWS provider picks
# them up from the default credential chain -- no explicit auth needed here.
#
# apiVersion v1, not v1beta1: v1beta1 stopped being served by the operator
# at v0.17.0 (unless the chart's crds.unsafeServeV1Beta1 is explicitly set,
# which it isn't here) -- confirmed directly against the pinned chart
# version's own CRD manifest (../Chart.yaml), not assumed from the version
# number jump alone. The field schema (spec.provider.aws.{service,region})
# is unchanged between v1beta1 and v1, so this is purely an apiVersion
# string change, not a spec rewrite.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: redemption-prod-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
