# No role-arn annotation: this ServiceAccount authenticates via EKS Pod
# Identity, whose pairing lives entirely on the AWS side, not this chart.
external-secrets:
  serviceAccount:
    create: true
    name: external-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true
  global: &tools-scheduling
    nodeSelector:
      karpenter.sh/nodepool: tools
    tolerations:
      - key: dedicated
        operator: Equal
        value: tools
        effect: NoSchedule
  webhook:
    <<: *tools-scheduling
    livenessProbe:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  certController:
    <<: *tools-scheduling
    livenessProbe:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
